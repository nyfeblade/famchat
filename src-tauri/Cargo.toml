[package]
name = "famchat"
version = "0.1.0"
edition = "2021"
description = "FamChat — a simple, private chat for your home network"
authors = ["nyfe"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["sync"] }
famchat-core = { path = "../crates/famchat-core" }
# Native OS notifications (macOS Notification Center / Windows toast / Linux).
tauri-plugin-notification = "2"

[features]
# used by `tauri build` for production asset embedding
custom-protocol = ["tauri/custom-protocol"]
