[package]
name = "famchat-hub"
version = "0.1.5"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FamChat Hub — an always-on relay + mailbox so family messages reach people who are offline."

[[bin]]
name = "famchat-hub"
path = "src/main.rs"

[dependencies]
famchat-core = { path = "../famchat-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
