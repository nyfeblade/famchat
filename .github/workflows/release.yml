name: Release

# Build FamChat for macOS, Windows, and Linux and attach the installers to a
# GitHub Release whenever a version tag (e.g. v0.1.0) is pushed. Also runnable by
# hand from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg that runs on both Apple Silicon and Intel Macs.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with mac targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      # Builds the app and uploads the .dmg / .msi+.exe / .AppImage+.deb to a
      # Release for this tag. Unsigned — see the README for the one-time
      # "unidentified developer" step on macOS and Windows.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sign the update artifacts so the in-app updater only installs builds
          # signed with our private key. The public half is baked into the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FamChat ${{ github.ref_name }}'
          releaseBody: 'Download FamChat for your computer below. First launch on macOS/Windows shows a one-time "unidentified developer" warning — see the README for how to open past it.'
          releaseDraft: false
          prerelease: false
          # Publish latest.json so installed copies can find and verify updates.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Also ship the headless hub server (Linux) so it can be dropped onto an
      # always-on machine. See HUB.md.
      - name: Build and attach the hub server (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p famchat-hub
          cp target/release/famchat-hub famchat-hub-linux-x86_64
          gh release upload "${{ github.ref_name }}" famchat-hub-linux-x86_64 packaging/famchat-hub.service --clobber
